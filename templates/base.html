<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Application Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <a href="{{ url_for('dashboard') }}" class="sidebar-brand">
            <div class="brand-icon">JT</div>
            <div class="brand-text">
                <h2>JobTracker</h2>
                <span>Application Manager</span>
            </div>
        </a>

        <nav class="sidebar-nav">
            <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.path == '/' %}active{% endif %}">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="9" rx="1"></rect>
                    <rect x="14" y="3" width="7" height="5" rx="1"></rect>
                    <rect x="14" y="12" width="7" height="9" rx="1"></rect>
                    <rect x="3" y="16" width="7" height="5" rx="1"></rect>
                </svg>
                <span>Dashboard</span>
            </a>

            <a href="{{ url_for('companies') }}" class="nav-link {% if request.path.startswith('/companies') or request.path.startswith('/edit-company') %}active{% endif %}">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 21h18"></path>
                    <path d="M5 21V7l8-4v18"></path>
                    <path d="M19 21V11l-6-4"></path>
                    <path d="M9 9h1"></path>
                    <path d="M9 13h1"></path>
                    <path d="M9 17h1"></path>
                </svg>
                <span>Companies</span>
            </a>

            <a href="{{ url_for('jobs') }}" class="nav-link {% if request.path.startswith('/jobs') or request.path.startswith('/edit-job') %}active{% endif %}">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
                <span>Jobs</span>
            </a>

            <a href="{{ url_for('applications') }}" class="nav-link {% if request.path.startswith('/applications') or request.path.startswith('/edit-application') %}active{% endif %}">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span>Applications</span>
            </a>

            <a href="{{ url_for('contacts') }}" class="nav-link {% if request.path.startswith('/contacts') or request.path.startswith('/edit-contact') %}active{% endif %}">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>Contacts</span>
            </a>

            <a href="{{ url_for('job_match') }}" class="nav-link {% if request.path.startswith('/job-match') %}active{% endif %}">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <circle cx="12" cy="12" r="6"></circle>
                    <circle cx="12" cy="12" r="2"></circle>
                </svg>
                <span>Job Match</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <span>MySQL &bull; Flask &bull; GenAI</span>
        </div>
    </aside>

    <!-- Main Content Container -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
