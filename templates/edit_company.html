{% extends "base.html" %}

{% block title %}Edit Company &bull; Job Application Tracker{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-header-text">
        <h1>Edit Company</h1>
        <p>Update company information and notes.</p>
    </div>
    <a href="{{ url_for('companies') }}" class="btn btn-secondary">
        &larr; Back to Companies
    </a>
</div>

<div class="card">
    <div class="card-title">
        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        Edit: {{ company.company_name }}
    </div>

    <form method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="company_name">Company Name <span class="required">*</span></label>
                <input type="text" id="company_name" name="company_name" value="{{ company.company_name }}" required>
            </div>

            <div class="form-group">
                <label for="industry">Industry</label>
                <input type="text" id="industry" name="industry" value="{{ company.industry or '' }}">
            </div>

            <div class="form-group">
                <label for="website">Website</label>
                <input type="text" id="website" name="website" value="{{ company.website or '' }}">
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" value="{{ company.city or '' }}">
            </div>

            <div class="form-group">
                <label for="state">State / Region</label>
                <input type="text" id="state" name="state" value="{{ company.state or '' }}">
            </div>

            <div class="form-group form-grid-full">
                <label for="notes">Notes / Background</label>
                <textarea id="notes" name="notes">{{ company.notes or '' }}</textarea>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                Update Company
            </button>
            <a href="{{ url_for('companies') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
